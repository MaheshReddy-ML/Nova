[project]
name = "nova-local"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4",
  "fastapi",
  "httpx",
  "nvidia-riva-client>=2.21.1",
  "playwright",
  "pydantic-settings",
  "uvicorn",
  "websockets>=17.4",
]

[project.scripts]
nova = "nova.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nova"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
