<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="t d">
  <title id="t">Nova systems check</title>
  <desc id="d">A terminal boot sequence listing Nova's subsystems: core model, voice, research, website studio, outreach, skills and phone bridge, each reporting OK.</desc>
  <style>
    .line { opacity: 0; animation: appear .35s ease-out forwards; }
    @keyframes appear { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    .cursor { opacity: 0; animation: appear .1s ease-out 4.35s forwards; }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { fill-opacity: 0; } }
    .dot { animation: led 2.4s ease-in-out infinite; }
    @keyframes led { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .line, .cursor { opacity: 1; } }
  </style>
  <rect x=".5" y=".5" width="999" height="329" rx="16" fill="#070e1d" stroke="#4f8cff" stroke-opacity=".35"/>
  <rect x="1" y="1" width="998" height="36" rx="15" fill="#0d182c"/>
  <rect x="1" y="22" width="998" height="15" fill="#0d182c"/>
  <circle cx="24" cy="19" r="5.5" fill="#ff6b7a" class="dot"/><circle cx="44" cy="19" r="5.5" fill="#f5b942" class="dot" style="animation-delay:.4s"/>
  <circle cx="64" cy="19" r="5.5" fill="#3ddc97" class="dot" style="animation-delay:.8s"/>
  <text x="500.0" y="24" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8796b3" letter-spacing="2">nova@local — systems check</text>
  <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">
    <g class="line" style="animation-delay:0.50s">
      <text x="34" y="74" fill="#3ddc97">▸</text>
      <text x="56" y="74" fill="#7fd0ff">[BOOT]</text>
      <text x="196" y="74" fill="#eaf0fb">Nova core online</text>
      <text x="430" y="74" fill="#8796b3">nemotron-3.5-super · 4/4 tool choices · 0.26 s to first word</text>
      <text x="966" y="74" text-anchor="end" fill="#3ddc97">OK</text>
    </g>
    <g class="line" style="animation-delay:1.05s">
      <text x="34" y="104" fill="#3ddc97">▸</text>
      <text x="56" y="104" fill="#7fd0ff">[VOICE]</text>
      <text x="196" y="104" fill="#eaf0fb">Wake word armed</text>
      <text x="430" y="104" fill="#8796b3">“Hey Nova” · Deepgram Aura-2 voice · Parakeet ears</text>
      <text x="966" y="104" text-anchor="end" fill="#3ddc97">OK</text>
    </g>
    <g class="line" style="animation-delay:1.60s">
      <text x="34" y="134" fill="#3ddc97">▸</text>
      <text x="56" y="134" fill="#7fd0ff">[RESEARCH]</text>
      <text x="196" y="134" fill="#eaf0fb">Sources verified</text>
      <text x="430" y="134" fill="#8796b3">web · arXiv · Semantic Scholar · every fetch hashed</text>
      <text x="966" y="134" text-anchor="end" fill="#3ddc97">OK</text>
    </g>
    <g class="line" style="animation-delay:2.15s">
      <text x="34" y="164" fill="#3ddc97">▸</text>
      <text x="56" y="164" fill="#7fd0ff">[STUDIO]</text>
      <text x="196" y="164" fill="#eaf0fb">Website concepts</text>
      <text x="430" y="164" fill="#8796b3">real photos · motion · Chromium + vision critic</text>
      <text x="966" y="164" text-anchor="end" fill="#3ddc97">OK</text>
    </g>
    <g class="line" style="animation-delay:2.70s">
      <text x="34" y="194" fill="#3ddc97">▸</text>
      <text x="56" y="194" fill="#7fd0ff">[OUTREACH]</text>
      <text x="196" y="194" fill="#eaf0fb">Drafts await you</text>
      <text x="430" y="194" fill="#8796b3">email + WhatsApp · nothing sent without “send it”</text>
      <text x="966" y="194" text-anchor="end" fill="#3ddc97">OK</text>
    </g>
    <g class="line" style="animation-delay:3.25s">
      <text x="34" y="224" fill="#3ddc97">▸</text>
      <text x="56" y="224" fill="#7fd0ff">[SKILLS]</text>
      <text x="196" y="224" fill="#eaf0fb">54 playbooks loaded</text>
      <text x="430" y="224" fill="#8796b3">pinned · license-checked · SHA-256 verified</text>
      <text x="966" y="224" text-anchor="end" fill="#3ddc97">OK</text>
    </g>
    <g class="line" style="animation-delay:3.80s">
      <text x="34" y="254" fill="#3ddc97">▸</text>
      <text x="56" y="254" fill="#7fd0ff">[CALL]</text>
      <text x="196" y="254" fill="#eaf0fb">Phone bridge ready</text>
      <text x="430" y="254" fill="#8796b3">rings you through ntfy · free WebRTC voice call</text>
      <text x="966" y="254" text-anchor="end" fill="#3ddc97">OK</text>
    </g>
    <text class="cursor" x="34" y="288" fill="#7fd0ff">nova ❯ <tspan fill="#eaf0fb">say “Hey Nova”</tspan><tspan class="caret"> ▮</tspan></text>
  </g>
</svg>
